services:
  api:
    build: ./backend
    ports:
      - "${API_PORT:-11100}:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/latebind.db
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    ports:
      - "${FRONTEND_PORT:-6100}:80"
    depends_on:
      - api
    restart: unless-stopped
